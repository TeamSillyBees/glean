# Local development only. All host bindings are loopback; not a production deployment.
name: glean
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: glean
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./tmp/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glean"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./tmp/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    profiles: ["app"]
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      APP_ENV: local
      INITRA_SERVER_ADDR: "0.0.0.0:8080"
      INITRA_DATABASE_HOST: postgres
      INITRA_DATABASE_DBNAME: glean
      INITRA_REDIS_ADDR: "redis:6379"
      INITRA_TASK_REDIS_ADDR: "redis:6379"
      INITRA_IDGEN_NODE: "1"
    volumes:
      - ./configs:/app/configs:ro
      - ./var:/app/var
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    profiles: ["app"]
    build: ./web
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      - backend
