worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Do not record query strings, request bodies, cookies or Authorization headers.
    log_format glean '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent';
    access_log /dev/stdout glean;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker user-defined network DNS. Resolve lazily so frontend health is independent
    # of backend startup and backend container IP changes are picked up automatically.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    map $uri $glean_cache_control {
        default "no-cache";
        /healthz "no-store";
        ~^/api(?:/|$) "no-store";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;
        set $glean_backend backend:8080;

        add_header Cache-Control $glean_cache_control;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        # Frontend liveness + built entry-file presence only; this is NOT API readiness.
        location = /healthz {
            access_log off;
            try_files /index.html =503;
        }

        # Never let API errors fall through to the SPA. No URI suffix on proxy_pass:
        # /api/v1/auth/login, query strings and request bodies reach Go unchanged.
        location ^~ /api/ {
            proxy_pass http://$glean_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
            proxy_cache off;
            proxy_intercept_errors off;
        }

        location = /api {
            return 404;
        }

        # Missing bundles must be 404, not HTML with a JavaScript content type.
        location ^~ /assets/ {
            try_files $uri =404;
        }
        location ~ /\. {
            deny all;
        }
        location ~* \.(?:js|css|map|woff2?|png|jpe?g|gif|webp|svg|ico)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
