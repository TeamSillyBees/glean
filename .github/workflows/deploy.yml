name: Glean production deployment

# Production consumes a verified image publication; it never builds or pushes images.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character SHA of current main with successful Glean CI
        required: true
        type: string
      image_run_id:
        description: Successful Glean image publication run ID for that exact commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: glean-production-deployment
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: github.repository == 'TeamSillyBees/glean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      backend: ${{ steps.images.outputs.backend }}
      web: ${{ steps.images.outputs.web }}
      image_attempt: ${{ steps.images.outputs.image_attempt }}
    steps:
      # Deliberately no checkout before validating the immutable release identity.
      - name: Require current main and latest successful exact-commit push CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase commit SHA is required.'; exit 1; }
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$DEPLOY_SHA" == "$main_sha" ]] || { echo 'Only current main may be deployed.'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&branch=main&event=push&per_page=100" \
            | jq --exit-status --arg sha "$DEPLOY_SHA" --arg repo "$GITHUB_REPOSITORY" '
                .workflow_runs | sort_by(.run_number) | last |
                .head_sha == $sha and .head_branch == "main" and .event == "push" and
                .head_repository.full_name == $repo and .status == "completed" and .conclusion == "success"' >/dev/null
          printf 'commit=%s\n' "$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Require successful image publication and validate its digest manifest
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ inputs.commit }}
          IMAGE_RUN_ID: ${{ inputs.image_run_id }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'A numeric image publication run ID is required.'; exit 1; }
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMAGE_RUN_ID")"
          jq --exit-status --arg sha "$DEPLOY_SHA" --arg repo "$GITHUB_REPOSITORY" --arg id "$IMAGE_RUN_ID" '
            (.id | tostring) == $id and .path == ".github/workflows/publish-images.yml" and
            .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and
            .head_repository.full_name == $repo and .status == "completed" and .conclusion == "success"' <<< "$run" >/dev/null
          attempt="$(jq --raw-output '.run_attempt' <<< "$run")"
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]]
          work="$(mktemp -d "$RUNNER_TEMP/glean-images.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          gh run download "$IMAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "glean-images-$attempt" --dir "$work"
          jq --exit-status --arg sha "$DEPLOY_SHA" --arg id "$IMAGE_RUN_ID" --arg attempt "$attempt" '
            .schema == 1 and .commit == $sha and .run_id == $id and .run_attempt == $attempt and
            (.backend | test("^ghcr[.]io/teamsillybees/glean-backend@sha256:[0-9a-f]{64}$")) and
            (.web | test("^ghcr[.]io/teamsillybees/glean-web@sha256:[0-9a-f]{64}$"))' "$work/images.json" >/dev/null
          printf 'backend=%s\nweb=%s\nimage_attempt=%s\n' \
            "$(jq --raw-output '.backend' "$work/images.json")" "$(jq --raw-output '.web' "$work/images.json")" "$attempt" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Required reviewers / main-only branch policy MUST be configured in Settings.
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      DEPLOY_SHA: ${{ needs.verify.outputs.commit }}
      PRODUCTION_BASE_DIR: ${{ vars.PRODUCTION_BASE_DIR }}
    steps:
      - name: Require explicit environment enablement and revalidate after approval
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          # Narrow path grammar is intentional: the value also crosses SSH/SCP shells.
          [[ "$PRODUCTION_BASE_DIR" =~ ^(/[a-zA-Z0-9._-]+)+$ && ! "$PRODUCTION_BASE_DIR" =~ (^|/)\.{1,2}(/|$) ]] || { echo 'Set PRODUCTION_BASE_DIR to a non-root absolute path without spaces, dot components or shell characters.'; exit 1; }
          [[ "$DEPLOY_ENABLED" == true ]] || { echo 'Production deployment is not enabled; configure protection and prerequisites first.'; exit 1; }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$DEPLOY_SHA" == "$main_sha" ]] || { echo 'Main changed while waiting for approval; dispatch a new release.'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&branch=main&event=push&per_page=100" \
            | jq --exit-status --arg sha "$DEPLOY_SHA" --arg repo "$GITHUB_REPOSITORY" '
                .workflow_runs | sort_by(.run_number) | last |
                .head_sha == $sha and .head_branch == "main" and .event == "push" and
                .head_repository.full_name == $repo and .status == "completed" and .conclusion == "success"' >/dev/null

      - name: Revalidate the same successful image publication attempt after approval
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_RUN_ID: ${{ inputs.image_run_id }}
          IMAGE_ATTEMPT: ${{ needs.verify.outputs.image_attempt }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_RUN_ID" =~ ^[1-9][0-9]*$ && "$IMAGE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMAGE_RUN_ID" \
            | jq --exit-status --arg sha "$DEPLOY_SHA" --arg repo "$GITHUB_REPOSITORY" --arg id "$IMAGE_RUN_ID" --arg attempt "$IMAGE_ATTEMPT" '
                (.id | tostring) == $id and (.run_attempt | tostring) == $attempt and
                .path == ".github/workflows/publish-images.yml" and
                .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and
                .head_repository.full_name == $repo and .status == "completed" and .conclusion == "success"' >/dev/null

      - name: Checkout validated immutable commit without saved credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Reject a superseded release before contacting production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_SHA" ]]
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$DEPLOY_SHA" == "$main_sha" ]] || { echo 'Main advanced; production was not changed.'; exit 1; }

      - name: Transfer immutable release and run server-local deployment
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_SSH_USER }}
          DEPLOY_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          BACKEND_IMAGE: ${{ needs.verify.outputs.backend }}
          WEB_IMAGE: ${{ needs.verify.outputs.web }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535 ))
          [[ -n "$SSH_PRIVATE_KEY" ]]
          [[ "$PRODUCTION_BASE_DIR" =~ ^(/[a-zA-Z0-9._-]+)+$ && ! "$PRODUCTION_BASE_DIR" =~ (^|/)\.{1,2}(/|$) ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          for image in "$BACKEND_IMAGE" "$WEB_IMAGE"; do
            [[ "$image" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          done
          work="$(mktemp -d "$RUNNER_TEMP/glean-deploy.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$work/key"
          unset SSH_PRIVATE_KEY
          ssh_options=(-i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            -o GlobalKnownHostsFile=/dev/null -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no -o ConnectTimeout=15
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          release="$PRODUCTION_BASE_DIR/releases/$DEPLOY_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # Archive committed files only: never runner files, .git, local secrets or dependencies.
          git archive --format=tar "$DEPLOY_SHA" > "$work/release.tar"
          mkdir -p "$work/stamp/deploy"
          printf '%s\n' "$DEPLOY_SHA" > "$work/stamp/deploy/REVISION"
          tar --append --file="$work/release.tar" -C "$work/stamp" deploy/REVISION
          gzip "$work/release.tar"
          # Fresh directory only: re-runs cannot overwrite a previously transferred release.
          # The pre-provisioned private base prevents another user swapping checked paths.
          # Check remote components BEFORE scp/tar can follow a symlink outside the base.
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$target" "python3 - '$PRODUCTION_BASE_DIR' '$release'" <<'PY'
          import os, stat, sys
          from pathlib import Path
          base, release = map(Path, sys.argv[1:])
          for path in (base, *base.parents, base / 'releases'):
              info = path.lstat()
              if not stat.S_ISDIR(info.st_mode):
                  raise SystemExit('Base and release ancestors must be real directories, not symlinks.')
          info = base.stat()
          if info.st_uid != os.geteuid() or info.st_mode & 0o077:
              raise SystemExit('Base must belong to the deploy user with owner-only permissions (0700).')
          release.mkdir(mode=0o700)
          PY
          scp "${ssh_options[@]}" -P "$DEPLOY_PORT" "$work/release.tar.gz" "$target:$release/release.tar.gz"
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$target" \
            "set -eu; cd '$release'; tar --extract --gzip --file=release.tar.gz --no-same-owner; rm release.tar.gz; PRODUCTION_BASE_DIR='$PRODUCTION_BASE_DIR' bash scripts/production/deploy.sh '$DEPLOY_SHA' '$BACKEND_IMAGE' '$WEB_IMAGE'"

      - name: Record immutable deployment identity
        env:
          BACKEND_IMAGE: ${{ needs.verify.outputs.backend }}
          WEB_IMAGE: ${{ needs.verify.outputs.web }}
        run: |
          printf 'Deployed commit: `%s`\n\nBackend: `%s`\n\nWeb: `%s`\n' \
            "$DEPLOY_SHA" "$BACKEND_IMAGE" "$WEB_IMAGE" >> "$GITHUB_STEP_SUMMARY"
