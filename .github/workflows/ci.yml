name: Glean CI

on:
  # Main retains full exact-commit CI; feature branches use their PR once.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A unique non-PR group protects running AND pending main/dispatch runs.
  group: glean-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Go, PostgreSQL and historical baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Isolated CI service only; no application, LLM or source API secrets required.
      INITRA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/glean_ci?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glean_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache locked Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}

      - name: Restore rolling compiled Go packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/go-build
          # Refresh source-dependent outputs instead of freezing them at go.sum.
          # Role-specific keys avoid competing saves. GitHub's branch scoping
          # prevents main from restoring a PR's cache; Go validates cached inputs.
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-

      - name: Verify module dependencies and generated Ent sources
        run: |
          go mod tidy
          go mod verify
          go generate ./internal/data
          git diff --exit-code -- go.mod go.sum internal/data/ent
          if [ -n "$(git status --porcelain --untracked-files=all -- go.mod go.sum internal/data/ent)" ]; then
            echo "Generated Ent sources or module dependencies are not fully committed."
            exit 1
          fi

      - name: Test conservative query diagnostic selection
        run: python3 -m unittest discover -s scripts/ci/tests -v

      - name: Select historical query diagnostics
        id: catalog_diagnostics
        run: python3 scripts/ci/catalog_diagnostics.py

      - name: Test all Go packages, real PostgreSQL and complete historical data
        env:
          GLEAN_CATALOG_QUERY_DIAGNOSTICS: ${{ steps.catalog_diagnostics.outputs.enabled == '0' && '0' || '1' }}
        run: |
          set -euo pipefail
          go test -json ./... -count=1 | tee "$RUNNER_TEMP/glean-go-test.jsonl"
          # Fail if a required database or full-snapshot test silently becomes skipped.
          python3 - "$RUNNER_TEMP/glean-go-test.jsonl" "$(go list -m)" <<'PY'
          import json
          import os
          import sys

          module = sys.argv[2]
          required = {
              (module + "/internal/modules/catalog", "TestCatalogPostgresEndToEnd"),
              (module + "/internal/modules/catalog", "TestCatalogFacetBatchEquivalence"),
              (module + "/internal/modules/catalog", "TestCatalogTopicCountsPostgres"),
              (module + "/internal/modules/catalog", "TestCatalogLiveObservationPostgres"),
              (module + "/internal/modules/catalog", "TestHistoricalAbstractEnrichmentPostgres"),
              (module + "/internal/modules/catalog", "TestCatalogManagementPostgres"),
              (module + "/internal/modules/catalog", "TestPipelineArchivePostgres"),
              (module + "/internal/modules/catalog", "TestModelPriorityPostgres"),
              (module + "/internal/modules/user", "TestUserAdministrationPostgres"),
              (module + "/internal/modules/monitor", "TestMonitorPostgresDurableMockRun"),
              (module + "/internal/modules/monitor", "TestMonitorPostgresDurableMockRun/CancellationPartialFailureFrozenTemplates"),
              (module + "/internal/modules/monitor", "TestMonitorPostgresProcessRestart"),
              (module + "/internal/modules/monitor", "TestMonitorRealPipelinePostgres"),
              (module + "/internal/modules/monitor", "TestPaperPipelinePostgresRestartAndCatalogProjection"),
              (module + "/test/integration", "TestMigrationsAndSeedOnPostgres"),
              (module + "/internal/baseline", "TestCommittedHistoricalManifest"),
              (module + "/internal/baseline", "TestHistoricalJournalRegistryPreservesEvidence"),
          }
          diagnostic = (module + "/internal/modules/catalog", "TestCatalogHistoricalQueryDiagnostics")
          enabled = os.environ.get("GLEAN_CATALOG_QUERY_DIAGNOSTICS") != "0"
          if enabled:
              required.add(diagnostic)
          skipped = set()
          passed = set()
          with open(sys.argv[1], encoding="utf-8") as results:
              for line in results:
                  event = json.loads(line)
                  if event.get("Action") == "skip" and event.get("Test"):
                      skipped.add((event["Package"], event["Test"]))
                  if event.get("Action") == "pass" and event.get("Test"):
                      passed.add((event["Package"], event["Test"]))
          if not enabled and diagnostic not in skipped:
              raise SystemExit("Disabled query diagnostic must explicitly skip")
          missing = required - passed
          if missing:
              raise SystemExit("Required database/baseline tests did not pass: " + repr(sorted(missing)))
          print("Verified real PostgreSQL catalog, immutable source observations, durable monitor projection, migrations and every committed baseline shard. External live API canaries are separate.")
          PY

      - name: Collect historical query diagnostics
        if: always() && steps.catalog_diagnostics.outputs.enabled != '0'
        run: |
          python3 - "$RUNNER_TEMP/glean-go-test.jsonl" "$RUNNER_TEMP/catalog-query-diagnostics.txt" <<'PY'
          import json
          import pathlib
          import sys

          source, destination = map(pathlib.Path, sys.argv[1:])
          lines = []
          if source.exists():
              for line in source.read_text(encoding="utf-8").splitlines():
                  event = json.loads(line)
                  output = event.get("Output", "")
                  if "CATALOG_DIAGNOSTIC " in output:
                      lines.append(output[output.index("CATALOG_DIAGNOSTIC "):].rstrip())
          destination.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines) if lines else "No query samples collected; inspect the required test result.")
          PY

      - name: Preserve diagnostic samples (not a latency gate)
        if: always() && steps.catalog_diagnostics.outputs.enabled != '0'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-query-diagnostics
          path: ${{ runner.temp }}/catalog-query-diagnostics.txt
          retention-days: 14

      - name: Recompute journal discovery coverage from every pinned historical shard
        run: python3 tools/journalregistry/compile.py --check

      - name: Vet Go packages
        run: go vet ./...

      - name: Build server, source monitor, baseline importer and abstract enricher
        run: |
          go build -o "$RUNNER_TEMP/glean-server" ./cmd/server
          go build -o "$RUNNER_TEMP/glean-monitor" ./cmd/glean-monitor
          go build -o "$RUNNER_TEMP/glean-importbaseline" ./tools/importbaseline
          go build -o "$RUNNER_TEMP/glean-enrichabstract" ./tools/enrichabstract

  recovery:
    name: Isolated backup and empty-database recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Disposable CI PostgreSQL only; never load production credentials.
      GLEAN_RECOVERY_CI_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/glean_recovery_ci?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glean_recovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Verify production script safety contracts
        run: python3 -m unittest discover -s scripts/production/tests -v
      - name: Back up and restore real records and private archive fixtures
        run: bash scripts/production/tests/recovery-drill.sh

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Test frontend behavior and session isolation
        run: npm test -- --maxWorkers=1

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build production frontend
        run: npm run build

      - name: Check frontend formatting
        run: npm run format:check

  containers:
    name: Container builds and isolated HTTP smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate local Compose without loading local credentials
        run: |
          LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)" \
            docker compose --env-file /dev/null --profile app config --quiet

      - name: Set up isolated Buildx builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build cached backend image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          tags: glean-backend:ci
          load: true
          push: false
          cache-from: type=gha,scope=glean-ci-backend
          cache-to: type=gha,mode=max,scope=glean-ci-backend

      - name: Build cached frontend image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./web
          tags: glean-web:ci
          load: true
          push: false
          cache-from: type=gha,scope=glean-ci-web
          cache-to: type=gha,mode=max,scope=glean-ci-web

      - name: Smoke-test backend, frontend and API proxy with disposable dependencies
        env:
          BACKEND_IMAGE: glean-backend:ci
          WEB_IMAGE: glean-web:ci
        run: bash scripts/ci/container-smoke.sh

  browser:
    name: Real database and browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Dedicated disposable services, not application or user credentials.
      # External-source acceptance belongs only to the manually dispatched workflow.
      GLEAN_E2E_PHASE: historical
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: glean_browser_ci
      GLEAN_E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/glean_browser_ci?sslmode=disable
      GLEAN_BASELINE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/glean_browser_ci?sslmode=disable
      GLEAN_E2E_USERNAME: glean-browser
      GLEAN_E2E_SECOND_USERNAME: glean-browser-other
      GLEAN_E2E_BASE_URL: http://127.0.0.1:18081
      GLEAN_API_PROXY: http://127.0.0.1:18080
      APP_ENV: local
      INITRA_SERVER_ADDR: 127.0.0.1:18080
      INITRA_DATABASE_DBNAME: glean_browser_ci
      INITRA_IDGEN_NODE: 1
      INITRA_TASK_WORKER_ENABLED: 'false'
      INITRA_TASK_SCHEDULER_ENABLED: 'false'
      INITRA_MONITOR_SCHEDULER_ENABLED: 'false'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: glean_browser_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache locked Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}

      - name: Restore rolling compiled Go packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/go-build
          # Refresh source-dependent outputs instead of freezing them at go.sum.
          # Role-specific keys avoid competing saves. GitHub's branch scoping
          # prevents main from restoring a PR's cache; Go validates cached inputs.
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Prepare isolated runtime and generated test-only identity
        run: |
          set -euo pipefail
          umask 077
          runtime="$RUNNER_TEMP/glean-browser"
          mkdir -p "$runtime/configs"
          cp configs/config.yaml configs/rbac_model.conf "$runtime/configs/"
          jwt_secret="$(openssl rand -hex 32)"
          password="$(openssl rand -hex 24)"
          new_password="$(openssl rand -hex 24)"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$password"
          echo "::add-mask::$new_password"
          printf 'INITRA_AUTH_JWT_SECRET=%s\nGLEAN_E2E_PASSWORD=%s\nGLEAN_E2E_NEW_PASSWORD=%s\n' "$jwt_secret" "$password" "$new_password" >> "$GITHUB_ENV"
          cat db/migrations/*.sql | psql --set ON_ERROR_STOP=1 --single-transaction > "$runtime/migrations.log"
          go build -o "$runtime/server" ./cmd/server
          go build -o "$runtime/importbaseline" ./tools/importbaseline
          go build -o "$runtime/browserseed" ./test/e2e/browserseed

      - name: Prepare frontend alongside the complete historical import
        run: |
          set -euo pipefail
          # Frontend files and isolated database import are independent. Wait for
          # both, even on failure; a failed background install must fail this job.
          (
            set -euo pipefail
            cd web
            npm ci --no-audit --no-fund
            npm run build
            npx playwright install --with-deps chromium
          ) &
          frontend_pid=$!
          trap 'status=$?; wait "$frontend_pid" || status=1; exit "$status"' EXIT
          runtime="$RUNNER_TEMP/glean-browser"
          "$runtime/browserseed"
          timeout 15m "$runtime/importbaseline" -mode import -node 17 -operator 7 \
            -allow-local-insecure -report "$runtime/import-report.json" \
            -quarantine "$runtime/quarantine.ndjson"
          python3 - "$runtime/import-report.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              report = json.load(source)
          assert report["complete"] is True, report
          assert report["attempted"] == report["created"] == 39495, report
          assert report["existing"] == report["quarantined"] == 0, report
          assert report["byTopic"] == {"biomed-ai": 31399, "llm-agent": 4059, "biomed-worldmodel": 4037}, report
          print("Real PostgreSQL import verified: all 39,495 historical memberships, zero quarantined.")
          PY
          test "$(psql -Atqc 'SELECT COUNT(*) FROM glean_membership')" = 39495
          test "$(psql -Atqc 'SELECT COUNT(*) FROM glean_paper WHERE is_mock')" = 0
          psql -Atqc 'SELECT COUNT(*) AS actual_papers FROM glean_paper'
          wait "$frontend_pid"
          trap - EXIT

      - name: Start actual Go HTTP API
        run: |
          runtime="$RUNNER_TEMP/glean-browser"
          cd "$runtime"
          ./server > "$runtime/server.log" 2>&1 &
          echo "$!" > "$runtime/server.pid"
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
            --max-time 5 --retry-max-time 90 http://127.0.0.1:18080/ready > /dev/null

      - name: Exercise real catalog, personal state and administrator workflows in browsers
        working-directory: web
        run: npm run test:e2e

      - name: Remove generated authentication secrets from native browser reports
        id: sanitize_reports
        if: always()
        run: |
          python3 -m unittest discover -s test/e2e -p 'sanitize_reports_test.py'
          python3 test/e2e/sanitize_reports.py web/playwright-report

      - name: Upload browser screenshots and sanitized HTML report
        if: always() && steps.sanitize_reports.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: glean-browser-${{ github.sha }}
          path: |
            web/test-results/**/*.png
            web/playwright-report/
          if-no-files-found: warn
          retention-days: 7
          # No HAR, traces, auth storage, server logs, secrets or quarantine data.
          include-hidden-files: false

      - name: Diagnose failed API startup or browser acceptance
        if: failure()
        run: |
          tail -n 80 "$RUNNER_TEMP/glean-browser/server.log" 2>/dev/null || true

      - name: Stop API and delete generated credentials
        if: always()
        run: |
          runtime="$RUNNER_TEMP/glean-browser"
          if [ -f "$runtime/server.pid" ]; then kill "$(cat "$runtime/server.pid")" 2>/dev/null || true; fi
          rm -rf "$runtime"
