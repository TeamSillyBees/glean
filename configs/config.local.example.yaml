app:
  instance_id: local-1

server:
  addr: "127.0.0.1:8080"

database:
  host: "127.0.0.1"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "initra"
  ssl_mode: disable
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 1h

auth:
  jwt:
    secret: ""

idgen:
  node: 1

log:
  level: debug
  console:
    enabled: true
    level: debug
    stack: short
  jsonl:
    enabled: true
    level: debug
    path: ./var/logs/app.jsonl

# 可选：先通过私密环境变量设置实际key；这里永远只填写变量名。
monitor:
  models:
    budget:
      max_calls: 100
      max_reserved_tokens: 1000000
      max_input_bytes: 131072
      max_output_tokens: 4096
    enabled: false # 显式启用且配置密钥后才允许模型处理及额外全文获取
    auto_display: false # 仅控制模型产物展示，不代表科学纳入
    jev:
      endpoint: ""
      model: ""
      api_key_env: INITRA_JEV_API_KEY
      timeout: 60s
    generative:
      endpoint: ""
      model: ""
      api_key_env: INITRA_GENERATIVE_API_KEY
      timeout: 60s
